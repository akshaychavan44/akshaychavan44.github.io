<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — Portfolio Studio</title><link rel="stylesheet" href="/admin.css"></head>
<body class="login-page">
  <main class="login-shell">
    <a class="studio-brand" href="/"><span class="brand-mark">a.</span><span>Portfolio<span class="brand-sub">STUDIO / LOCAL EDITOR</span></span></a>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">YOUR WORK. YOUR SPACE.</p>
      <h1 id="login-title">Welcome back.</h1>
      <p class="page-description">Sign in to give your portfolio its next update.</p>
      <form id="login-form">
        <label class="field" for="email">Email address<input id="email" type="email" name="email" autocomplete="username" placeholder="you@example.com" required maxlength="254"></label>
        <label class="field" for="password">Password<span class="password-control"><input id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required maxlength="256"><button type="button" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button></span></label>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button type="submit" class="button primary" id="login-submit">Sign in <span aria-hidden="true">↗</span></button>
      </form>
      <p class="login-note"><span class="local-dot"></span> Local workspace · Only you manage what’s next.</p>
    </section>
    <a class="login-back" href="/">← Back to portfolio</a>
  </main>
  <script type="module" src="/login.js"></script>
</body></html>
